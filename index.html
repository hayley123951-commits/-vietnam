<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFECE3">
<title>球球小分隊 · 越南篇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#EFECE3;
  --card:#FFFFFF;
  --tint:#E7EBF2;
  --sky:#8EABD5;
  --blue:#4C70A2;
  --blue-d:#33507A;
  --ink:#0A0B0D;
  --mute:#84837D;
  --line:#DFDBD1;
  --line-l:#EAE7DF;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',"PingFang TC","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hide{display:none !important}
.lbl{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

.banner{
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
}
.banner .btitle{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.banner .btitle span{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;
  color:var(--blue);border:1px solid var(--sky);border-radius:2px;padding:2px 5px;
  vertical-align:middle;margin-left:5px;
}
.banner .sub i{font-style:normal;color:var(--sky);margin:0 3px}
.banner .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);margin-top:7px}
.banner .who{text-align:right;flex:0 0 auto}
.banner .who b{display:block;font-size:13.5px;font-weight:500}
.banner .who span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mute)}

.view{padding:18px 16px 6px}
.viewhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.viewhead h2{font-size:19px;font-weight:600;letter-spacing:-.012em;margin:0}
.viewhead .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mute)}

.filters{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);border-radius:3px;
  padding:6px 11px;font-size:12.5px;color:var(--mute);background:none;min-height:32px;
}
.chip em{font-family:var(--mono);font-style:normal;font-size:10.5px;margin-left:5px;opacity:.6}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[aria-pressed="true"] em{opacity:.5}

.card{background:var(--card);border:1px solid var(--line-l);border-radius:4px;margin-bottom:9px}
.card .top,.stay .top{display:flex;gap:12px;padding:13px 14px 11px}
.mark{
  flex:0 0 44px;height:44px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:500;overflow:hidden;
}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0}
.name{font-weight:500;font-size:15px;line-height:1.35;margin:0 0 5px;word-break:break-word}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  border:1px solid var(--line);border-radius:2px;padding:2px 6px;color:var(--mute);
}
.by{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--mute)}
.tag.warn{color:var(--blue);border-color:var(--sky)}
.sc{flex:0 0 auto;text-align:right;min-width:26px}
.sc b{display:block;font-family:var(--mono);font-weight:600;font-size:21px;line-height:1}
.sc.z b{color:var(--line)}
.brief{
  padding:11px 14px 12px;font-size:12.5px;line-height:1.7;color:#4A4A46;
  border-top:1px dashed var(--line-l);
}
.brief .lbl{display:block;margin-bottom:5px}
.brief.load{color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);padding:0 14px 11px}

.vote{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line-l)}
.vote.two{grid-template-columns:1fr 1fr}
.vote button{
  padding:10px 2px;font-size:12px;color:var(--mute);
  border-right:1px solid var(--line-l);min-height:42px;transition:background .12s,color .12s;
}
.vote button:last-child{border-right:0}
.vote .a[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:500}
.vote .b[aria-pressed="true"]{background:var(--tint);color:var(--blue-d);font-weight:500}
.vote .c[aria-pressed="true"]{background:#E5E2D9;color:var(--mute)}
.links{display:flex;border-top:1px solid var(--line-l)}
.links a,.links button{
  flex:1;text-align:center;padding:9px 4px;font-size:11.5px;color:var(--blue);
  text-decoration:none;border-right:1px solid var(--line-l);min-height:37px;
}
.links a:last-child,.links button:last-child{border-right:0}
.links .g{color:var(--mute)}

.stay{border:1px solid var(--sky);border-radius:4px;background:var(--card);margin-bottom:9px}
.stay.on{border-color:var(--blue);border-width:1.5px}
.staybar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 14px;border-top:1px solid var(--line-l);
}
.staybar span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute)}
.lockbtn{border:1px solid var(--blue);color:var(--blue);border-radius:3px;padding:6px 13px;font-size:12px;min-height:34px}
.lockbtn.on{background:var(--blue);color:#fff}
.sechead{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.sechead::after{content:"";flex:1;height:1px;background:var(--line)}

.empty{text-align:center;padding:52px 26px;color:var(--mute)}
.empty b{display:block;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:7px}
.empty p{font-size:12.5px;margin:0;line-height:1.75}

#map{height:calc(100vh - 250px);min-height:320px;border-radius:4px;border:1px solid var(--line)}
.mapnote{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--mute);text-align:center;padding:9px 0 0}

.daytabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{
  flex:0 0 auto;border:1px solid var(--line);border-radius:3px;padding:8px 13px;
  text-align:left;min-width:76px;background:none;
}
.daytab b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.2}
.daytab span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--mute)}
.daytab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.daytab[aria-pressed="true"] span{color:rgba(255,255,255,.55)}

.dayhead{font-size:12.5px;color:var(--mute);padding:0 2px 16px;line-height:1.7}
.rail{position:relative;padding-left:66px}
.rail::before{content:"";position:absolute;left:52px;top:8px;bottom:16px;border-left:1px solid var(--line)}
.stub{position:relative;background:var(--card);border:1px solid var(--line-l);border-radius:4px;padding:11px 13px}
.stub .t{
  position:absolute;left:-66px;top:11px;width:44px;text-align:right;
  font-family:var(--mono);font-weight:600;font-size:14px;line-height:1.2;color:var(--ink);
}
.stub .t em{display:block;font-style:normal;font-size:9px;color:var(--mute);font-weight:400;margin-top:3px;letter-spacing:.04em}
.tbtn{font:inherit;color:inherit;padding:2px 0;border-bottom:1px dashed var(--line)}
.tinput{
  font-family:var(--mono);font-size:12px;width:44px;padding:1px 0;
  border:0;border-bottom:1px solid var(--blue);background:none;color:var(--ink);
}
.xbtn{
  position:absolute;top:6px;right:6px;width:28px;height:28px;
  color:var(--line);font-size:15px;line-height:1;
}
.stub::before{
  content:"";position:absolute;left:-17px;top:16px;width:6px;height:6px;border-radius:50%;
  background:var(--ink);outline:3px solid var(--paper);
}
.stub .n{font-weight:500;font-size:14.5px;line-height:1.35;margin-bottom:5px}
.stub .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--mute)}
.stub.gap{background:none;border-style:dashed;border-color:var(--line)}
.stub.gap .n{font-weight:400;font-size:13px;color:var(--mute)}
.stub.gap .t{color:var(--line)}
.stub.gap::before{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.stub.fix{background:var(--ink);border-color:var(--ink)}
.stub.fix .n{color:#fff}
.stub.fix .m{color:rgba(255,255,255,.5)}
.stub.fix .t em{color:var(--blue)}
.stub.base{background:var(--tint);border-color:var(--sky)}
.stub.base .n{color:var(--blue-d)}
.stub.base::before{background:var(--blue)}
.hop{
  position:relative;padding:8px 0 8px 2px;
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;color:var(--mute);
}
.planfoot{
  margin-top:16px;padding:13px 14px;border:1px solid var(--line);border-radius:4px;
  font-size:12px;color:var(--mute);line-height:1.75;
}
.planedit{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding:10px 13px;border:1px dashed var(--sky);border-radius:4px;
  font-size:12px;color:var(--blue-d);background:var(--tint);
}
.planedit button{border:1px solid var(--blue);color:var(--blue);border-radius:3px;padding:5px 11px;font-size:11.5px;min-height:30px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.seg button{border:1px solid var(--line);border-radius:3px;padding:9px;font-size:12.5px;color:var(--mute);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 電腦版：把整個介面收成一欄，避免卡片被拉得過寬 */
@media (min-width:600px){
  .banner,.view,.filters,.daytabs{max-width:560px;margin-left:auto;margin-right:auto}
  .navinner{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .sheet{border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .gate{align-items:center}
  .gate>*{width:100%;max-width:420px}
  #map{height:min(58vh,520px)}
}

.rate{
  display:flex;align-items:center;gap:6px;padding:10px 13px;margin-bottom:14px;
  border:1px solid var(--line);border-radius:4px;font-size:12.5px;color:var(--mute);
}
.rate input{
  width:64px;font-family:var(--mono);font-size:13px;text-align:center;
  border:0;border-bottom:1px solid var(--line);background:none;padding:2px 0;color:var(--ink);
}
.exp{background:var(--card);border:1px solid var(--line-l);border-radius:4px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.exp .x{flex:1;min-width:0}
.exp .ttl{font-weight:500;font-size:14.5px;margin-bottom:4px}
.exp .w{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--mute)}
.exp .amt{text-align:right;flex:0 0 auto}
.exp .amt b{display:block;font-family:var(--mono);font-weight:600;font-size:14px}
.exp .amt span{font-family:var(--mono);font-size:10px;color:var(--mute)}
.exp .rm{flex:0 0 auto;color:var(--line);font-size:17px;padding:0 2px;line-height:1}
.settle{border:1.5px solid var(--ink);border-radius:4px;padding:15px 15px 13px;margin-top:18px}
.settle h3{font-size:15px;font-weight:600;margin:0 0 3px}
.settle .tot{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--mute);margin-bottom:14px}
.bal{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line-l);font-size:13.5px}
.bal b{font-family:var(--mono);font-weight:600;font-size:13px}
.bal .pos{color:var(--blue)}
.tx{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.tx .row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px}
.tx .row b{font-family:var(--mono);font-weight:600;font-size:13px;margin-left:auto}
.tx .arw{color:var(--sky);font-family:var(--mono)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(239,236,227,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.navinner{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px;margin:0 auto}
.nav button{padding:11px 0 12px;color:var(--mute);min-height:54px;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.nav button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.nav button::before{content:"";display:block;width:5px;height:5px;border-radius:50%;background:transparent;margin:0 auto 6px}
.nav button[aria-pressed="true"]::before{background:var(--blue)}
.fab{
  position:fixed;right:max(16px, calc(50vw - 264px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:41;
  height:46px;padding:0 20px;border-radius:3px;background:var(--ink);color:#fff;
  font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  box-shadow:0 4px 18px -6px rgba(10,11,13,.5);
}

.scrim{position:fixed;inset:0;background:rgba(10,11,13,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:51;background:var(--paper);
  border-radius:10px 10px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:92vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:3px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.sheet .lead{font-size:12.5px;color:var(--mute);margin:0;line-height:1.7}
label.fl{display:block;margin:16px 0 7px}
.field{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:11px 12px;min-height:44px;
}
.field:focus{outline:1.5px solid var(--blue);border-color:transparent}
textarea.field{resize:none;line-height:1.5}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catbtn{border:1px solid var(--line);border-radius:3px;padding:11px 2px;text-align:center;min-height:46px;font-size:12.5px;color:var(--mute)}
.catbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.people{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{border:1px solid var(--line);border-radius:3px;padding:8px 13px;font-size:13px;color:var(--mute);min-height:38px}
.pbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{
  width:100%;background:var(--ink);color:#fff;border-radius:3px;padding:14px;
  font-size:14.5px;font-weight:500;margin-top:20px;min-height:48px;
}
.btn:disabled{opacity:.3}
.btn.g{background:none;color:var(--mute);font-size:12.5px;margin-top:6px;padding:10px;font-weight:400}
.hint{font-size:11.5px;color:var(--mute);margin-top:7px;line-height:1.6}
.hint.w{color:var(--blue-d)}
.hint.o{color:var(--blue)}
.shotp{display:flex;gap:10px;align-items:center;margin-top:10px}
.shotp img{width:56px;height:56px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}

.gate{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:32px 26px}
.gate .ttl{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1}
.gate .sub2{
  font-size:16px;font-weight:500;color:var(--blue);margin-top:8px;letter-spacing:.02em;
}
.gate .dt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);margin-top:16px}
.gate p{font-size:13.5px;color:var(--mute);line-height:1.85;margin:28px 0 4px;max-width:23em}
.claim{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.claim button{border:1px solid var(--line);border-radius:3px;padding:7px 12px;font-size:12.5px;color:var(--mute);min-height:34px}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:3px;font-size:12.5px;
  z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="ttl">球球小分隊</div>
  <div class="sub2">越南篇</div>
  <div class="dt">TPE → SGN　10 · 24 — 10 · 27</div>
  <p>把想去的地方丟進來，一起投票。<br>票高的會自動排成順路的四天行程。</p>
  <label class="fl lbl" for="nick">你是誰</label>
  <input class="field" id="nick" placeholder="打上你的名字" autocomplete="off" maxlength="10">
  <button class="btn" id="enterBtn">進去</button>
  <button class="btn g" id="claimToggle">換過手機？從清單認回自己</button>
  <div class="claim hide" id="claimRow"></div>
</div>

<div class="banner">
  <div>
    <div class="btitle">球球小分隊 <span>越南篇</span></div>
    <div class="sub">TPE<i>→</i>SGN　JX711　10/24　4天3夜</div>
  </div>
  <button class="who" id="whoBtn"><b id="meName">—</b><span id="memberCount">—</span></button>
</div>

<section id="v-list">
  <div class="view viewhead"><h2>想去的地方</h2>
    <button class="n" id="sortBtn" style="border-bottom:1px dashed var(--line)">依票數排序 · <span id="listCount">0</span></button></div>
  <div id="stayZone"></div>
  <div class="filters" id="filters"></div>
  <div class="view" style="padding-top:0" id="listBody"></div>
</section>

<section id="v-map" class="hide">
  <div class="view viewhead"><h2>都在哪裡</h2><div class="n">點越大 · 票越多</div></div>
  <div class="view" style="padding-top:0">
    <div id="map"></div><div class="mapnote">© OPENSTREETMAP</div>
  </div>
</section>

<section id="v-plan" class="hide">
  <div class="view viewhead"><h2>排出來的行程</h2><div class="n" id="planTag">依票數與距離</div></div>
  <div class="daytabs" id="dayTabs"></div>
  <div class="view" style="padding-top:0" id="planBody"></div>
</section>

<section id="v-cost" class="hide">
  <div class="view viewhead"><h2>記帳</h2><div class="n" id="costCount">0 筆</div></div>
  <div class="view" style="padding-top:0" id="costBody"></div>
</section>

<nav class="nav"><div class="navinner">
  <button data-view="list" aria-pressed="true">清單</button>
  <button data-view="map" aria-pressed="false">地圖</button>
  <button data-view="plan" aria-pressed="false">行程</button>
  <button data-view="cost" aria-pressed="false">記帳</button>
</div></nav>
<button class="fab" id="fab">＋ 新增</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">丟一個地方</h3>

function haversine(a,b){
  const R=6371,r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const rideMin=(a,b)=>Math.max(7,Math.round(haversine(a,b)*1.35/18*60));

function parseMapsUrl(url){
  const o={name:"",lat:null,lng:null,short:false};
  if(!url) return o;
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/.test(url)) o.short=true;
  const at=url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(at){o.lat=+at[1];o.lng=+at[2]}
  if(o.lat===null){const d=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);if(d){o.lat=+d[1];o.lng=+d[2]}}
  if(o.lat===null){const q=url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);if(q){o.lat=+q[1];o.lng=+q[2]}}
  const pl=url.match(/\/place\/([^\/@?]+)/);
  if(pl){try{o.name=decodeURIComponent(pl[1]).replace(/\+/g," ")}catch(e){}}
  return o;
}

/* 有連結但沒座標的，開站後在背景一筆一筆展開補上 */
let backfilling=false;
async function backfillCoords(){
  if(!API_URL||backfilling) return;
  const todo=state.places.filter(p=>p.url&&(p.lat==null));
  if(!todo.length) return;
  backfilling=true;
  for(const p of todo){
    const r=await api("resolve",{url:p.url});
    if(r&&r.ok){
      p.lat=r.lat; p.lng=r.lng;
      if(r.name) p.name=r.name;   // 補充那句保留不動
      await api("updatePlace",{place:p});
    }
  }
  backfilling=false;
  renderAll(); toast(`補上了 ${todo.length} 個地點的座標`);
}

function refreshCard(id){
  const box=document.querySelector(`.vote[data-id="${id}"]`);
  if(!box) return renderList();
  const mv=myVote(id), s=scoreOf(id);
  [...box.children].forEach(b=>b.setAttribute("aria-pressed", +b.dataset.v===mv));
  const sc=box.closest("article").querySelector(".sc");
  sc.querySelector("b").textContent=s;
  sc.classList.toggle("z", s===0);
}

let briefBusy=false;
async function fetchBriefs(){
  if(!API_URL||briefBusy) return;
  const el=document.querySelector("[data-brief]"); if(!el) return;
  const p=state.places.find(x=>x.id===el.dataset.brief); if(!p) return;
  briefBusy=true;
  const r=await api("brief",{id:p.id,name:p.name,cat:p.cat});
  briefBusy=false;
  if(r&&r.ok&&r.text){ p.brief=r.text; renderList(); }
  else if(el.isConnected){ el.classList.remove("load");
    el.innerHTML=`<span class="lbl">參考介紹</span>沒拿到介紹，可以點下面的 Google 地圖看評論。`; }
}

let map,layer;
function renderMap(){
  const pts=state.places.filter(p=>p.lat&&p.lng);
  if(!map){
    map=L.map("map",{zoomControl:false}).setView([10.7757,106.7004],14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
    L.control.zoom({position:"bottomright"}).addTo(map);
    layer=L.layerGroup().addTo(map);
  }
  layer.clearLayers();
  pts.forEach(p=>{
    const s=scoreOf(p.id),c=catOf(p.cat),hotel=p.cat==="住宿";
    L.circleMarker([p.lat,p.lng],{
      radius:6+Math.max(0,s)*1.3,
      color:hotel?"#4C70A2":"#fff",weight:hotel?2.5:1.5,
      fillColor:hotel?"#fff":c.color,fillOpacity:hotel?1:.9
    }).addTo(layer).bindPopup(`<b>${esc(p.name)}</b><br>${c.k} · ${s} 分`);
  });
  if(pts.length) map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36],maxZoom:15});
  setTimeout(()=>map.invalidateSize(),60);
}

/* ===== 行程 ===== */
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(((m%60)+60)%60).padStart(2,"0");
const toMin=s=>(+s.split(":")[0])*60+(+s.split(":")[1]);

/* 每天的時間可以被使用者改過，改一格後面全部跟著移動 */
function dayTimes(di){
  const e=state.planEdits[di]||{};
  return TRIP.days[di].slots.map((s,i)=>(e.times&&e.times[i]!=null)?e.times[i]:toMin(s[0]));
}
const isRemoved=(di,i)=>((state.planEdits[di]||{}).removed||[]).indexOf(i)>=0;
function saveEdits(){ api("setConfig",{key:"planEdits",value:JSON.stringify(state.planEdits)}) }
function shiftFrom(di,i,newMin){
  const t=dayTimes(di), delta=newMin-t[i];
  if(!delta) return renderPlan();
  const e=state.planEdits[di]=state.planEdits[di]||{};
  e.times=e.times||{};
  for(let j=i;j<t.length;j++) e.times[j]=t[j]+delta;
  saveEdits(); renderPlan();
  toast(delta>0?`這格之後都往後 ${delta} 分`:`這格之後都往前 ${-delta} 分`);
}
function toggleRemove(di,i){
  const e=state.planEdits[di]=state.planEdits[di]||{};
  e.removed=e.removed||[];
  const k=e.removed.indexOf(i);
  if(k>=0) e.removed.splice(k,1); else e.removed.push(i);
  saveEdits(); renderPlan();
}

function buildPlan(){
  const hotel=state.places.find(p=>p.id===state.hotel)||null;
  const pool=state.places.filter(p=>p.cat!=="住宿"&&scoreOf(p.id)>0).map(p=>({...p,s:scoreOf(p.id)}));
  const used=new Set();
  return TRIP.days.map((day,di)=>{
    const times=dayTimes(di);
    let last=hotel, first=true;
    const stops=[];
    day.slots.forEach(([,cat],i)=>{
      if(isRemoved(di,i)) return;
      const at=hhmm(times[i]);
      const cand=pool.filter(p=>!used.has(p.id)&&p.cat===cat);
      if(!cand.length){ stops.push({at,cat,slot:i,gap:true}); return }
      const best=cand.map(p=>{
        const ride=(last&&last.lat&&p.lat)?rideMin(last,p):null;
        return {p,ride,adj:p.s-(ride||0)/10*0.5};
      }).sort((a,b)=>b.adj-a.adj)[0];
      used.add(best.p.id);
      const ride=(first&&!hotel)?null:best.ride;
      first=false; last=best.p;
      stops.push({at,cat,slot:i,gap:false,...best.p,ride});
    });
    return {...day,stops,filled:stops.filter(s=>!s.gap).length};
  });
}

  let html=`<div class="dayhead">${esc(d.note)}　時間可以直接點著改，改一格後面會跟著移動。</div><div class="rail">`;

    <div class="n">${esc(d.head.n)}</div><div class="m">${esc(d.head.s)}</div></div>`;

  if(h){

    const t=d.checkin||d.checkout||"08:15";

    const time=`<div class="t"><button class="tbtn" data-time="${s.slot}">${s.at}</button>${

    <div class="stub base"><div class="t">—</div><div class="n">${esc(h.name)}</div><div class="m">回房</div></div>`;
  if(d.tail) html+=`<div class="hop">回程反向 · 塞車抓 50 分</div>

  html+=`</div>`;

  const ed=state.planEdits[planDay];

    ${gaps?`這天還有 ${gaps} 格沒東西可放。`:""}</div>`;
  $("#planBody").innerHTML=html;

/* ===== 記帳 ===== */
function settle(){
  const bal={}; state.members.forEach(m=>bal[m.id]=0);
  state.expenses.forEach(e=>{
    if(!e.split||!e.split.length) return;
    const share=e.amount/e.split.length;
    bal[e.payer]=(bal[e.payer]||0)+e.amount;
    e.split.forEach(id=>bal[id]=(bal[id]||0)-share);
  });
  const cred=[],debt=[];
  Object.entries(bal).forEach(([id,v])=>{ if(v>500)cred.push({id,v}); else if(v<-500)debt.push({id,v:-v}) });
  cred.sort((a,b)=>b.v-a.v); debt.sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<cred.length&&j<debt.length){
    const amt=Math.min(cred[i].v,debt[j].v);
    tx.push({from:debt[j].id,to:cred[i].id,amt});
    cred[i].v-=amt; debt[j].v-=amt;
    if(cred[i].v<500)i++;
    if(debt[j].v<500)j++;
  }
  return {bal,tx};
}
function renderCost(){
  $("#costCount").textContent=state.expenses.length+" 筆";
  const total=state.expenses.reduce((a,e)=>a+e.amount,0);
  let html=`<div class="rate">1 TWD ≈ <input id="rateIn" type="number" inputmode="numeric" value="${state.rate}"> VND　可以改</div>`;
  html += state.expenses.length ? state.expenses.map(e=>`<div class="exp">
      <div class="x"><div class="ttl">${esc(e.title)}</div>
        <div class="w">${esc(nameOf(e.payer))} 付 · 分 ${e.split.length} 人</div></div>
      <div class="amt"><b>${vnd(e.amount)}</b><span>NT$ ${twd(e.amount)}</span></div>
      <button class="rm" data-exp="${e.id}">×</button></div>`).join("")
    : `<div class="empty"><b>還沒記過帳</b><p>出發後誰先付了什麼，<br>按右下角記一筆就好。</p></div>`;

  if(state.expenses.length){
    const {bal,tx}=settle();
    html+=`<div class="settle"><h3>結算</h3>
      <div class="tot">總支出 ${vnd(total)} VND · NT$ ${twd(total)}</div>`;
    state.members.forEach(m=>{
      const v=bal[m.id]||0;
      html+=`<div class="bal"><span>${esc(m.name)}</span>
        <b class="${v>=0?"pos":""}">${v>=0?"應收":"應付"} ${vnd(Math.abs(v))}</b></div>`;
    });
    html += tx.length ? `<div class="tx"><span class="lbl">最少筆數還錢</span>
        ${tx.map(t=>`<div class="row"><span>${esc(nameOf(t.from))}</span><span class="arw">→</span>
        <span>${esc(nameOf(t.to))}</span><b>${vnd(t.amt)}</b></div>`).join("")}</div>`
      : `<div class="tx"><span class="lbl">已經打平了</span></div>`;
    html+=`</div>`;
  }
  $("#costBody").innerHTML=html;
}

});

  img.onload=()=>{
    const k=Math.min(1,1000/Math.max(img.width,img.height));

    cv.width=img.width*k; cv.height=img.height*k;
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);

    }
    if(r&&r.ok){
      state.members=r.members; state.places=r.places; state.votes=r.votes;
      state.expenses=r.expenses||[]; state.hotel=r.hotel||null; state.rate=r.rate||800;
      try{ state.planEdits=r.planEdits?JSON.parse(r.planEdits):{} }catch(_){ state.planEdits={} }
    }
  } else demoSeed();
  ensureOrder(); state.order.sort((a,b)=>scoreOf(b)-scoreOf(a));
  backfillCoords();
  const saved=store.get("sgn_me");
  if(saved){
    const m=JSON.parse(saved);
    if(!state.members.find(x=>x.id===m.id)) state.members.push(m);
    enter(m);
  }
})();
</script>
